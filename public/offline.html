<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b1120">
    <title>Pickup Puck - Offline</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b1120;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            padding-top: calc(24px + env(safe-area-inset-top, 0px));
            text-align: center;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 24px;
            padding: 36px 28px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
        }
        .logo-wrap {
            position: relative;
            width: 96px;
            height: 96px;
            margin: 0 auto 20px auto;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(15, 23, 42, 0.8));
            border: 1px solid rgba(56, 189, 248, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.2);
        }
        .logo-wrap img {
            width: 72px;
            height: 72px;
            object-fit: contain;
        }
        .offline-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: rgba(244, 63, 94, 0.15);
            border: 1px solid rgba(244, 63, 94, 0.35);
            color: #fda4af;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 5px 14px;
            border-radius: 9999px;
            margin-bottom: 16px;
        }
        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #f43f5e;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 10px;
            letter-spacing: -0.02em;
        }
        p {
            font-size: 14px;
            line-height: 1.6;
            color: #94a3b8;
            margin-bottom: 28px;
        }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        button {
            cursor: pointer;
            border: none;
            outline: none;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            padding: 14px 20px;
            border-radius: 14px;
            transition: all 0.2s ease;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-retry {
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            color: #04131f;
            box-shadow: 0 8px 20px -4px rgba(56, 189, 248, 0.35);
        }
        .btn-retry:hover {
            background: linear-gradient(135deg, #7dd3fc, #38bdf8);
            transform: translateY(-1px);
        }
        .btn-retry:active {
            transform: translateY(0);
        }
        .btn-back {
            background: rgba(51, 65, 85, 0.6);
            color: #e2e8f0;
            border: 1px solid rgba(148, 163, 184, 0.2);
        }
        .btn-back:hover {
            background: rgba(51, 65, 85, 0.9);
            color: #ffffff;
        }
        .status-msg {
            margin-top: 18px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-wrap">
            <img src="/icons/icon-192x192.png" alt="Pickup Puck" onerror="this.style.display='none'">
        </div>
        <div class="offline-badge">
            <span class="pulse-dot"></span>
            <span>You Are Offline</span>
        </div>
        <h1>Off the Ice!</h1>
        <p>Pickup Puck needs an active internet connection to load live rosters, game details, and sync attendance. Check your Wi-Fi or mobile data.</p>
        
        <div class="actions">
            <button class="btn-retry" id="retryBtn" onclick="tryReconnect()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
                </svg>
                <span>Retry Connection</span>
            </button>
            <button class="btn-back" onclick="history.back()">
                <span>Go Back</span>
            </button>
        </div>
        <div class="status-msg" id="statusMsg">Pickup Puck will automatically reconnect when back online.</div>
    </div>

    <script>
        function tryReconnect() {
            const btn = document.getElementById('retryBtn');
            const msg = document.getElementById('statusMsg');
            btn.disabled = true;
            btn.innerHTML = '<span>Checking connection...</span>';
            
            if (navigator.onLine) {
                msg.textContent = 'Connection detected! Reloading...';
                window.location.reload();
            } else {
                fetch('/icons/favicon-32x32.png?t=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
                    .then(() => {
                        msg.textContent = 'Back online! Reloading...';
                        window.location.reload();
                    })
                    .catch(() => {
                        msg.textContent = 'Still offline. Please check your network connection.';
                        setTimeout(() => {
                            btn.disabled = false;
                            btn.innerHTML = `
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
                                </svg>
                                <span>Retry Connection</span>
                            `;
                        }, 1200);
                    });
            }
        }

        window.addEventListener('online', () => {
            const msg = document.getElementById('statusMsg');
            if (msg) msg.textContent = 'Network detected! Reconnecting to the locker room...';
            setTimeout(() => {
                window.location.reload();
            }, 800);
        });
    </script>
</body>
</html>
